<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <title>Ambient Backgrounds</title>
</head>
<body>
  <div class="content--canvas"></div>

  <div class="ui">
    <button class="ui-arrow ui-arrow--left" aria-label="Previous effect">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>

    <div class="ui-center">
      <h1 class="ui-title"></h1>
      <div class="ui-dots"></div>
    </div>

    <button class="ui-arrow ui-arrow--right" aria-label="Next effect">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 6 15 12 9 18"/></svg>
    </button>
  </div>
</body>
</html>
